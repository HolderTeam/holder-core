name: Holder core

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    runs-on: ubuntu-24.04

    steps:
      - name: Check out holder-core
        uses: actions/checkout@v4

      - name: Restore apt package cache
        uses: actions/cache/restore@v4
        with:
          path: .apt-cache/debs
          key: apt-${{ runner.os }}-${{ hashFiles('.github/workflows/core.yml') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            apt-${{ runner.os }}-${{ hashFiles('.github/workflows/core.yml') }}-
            apt-${{ runner.os }}-

      - name: Install dependencies
        run: |
          mkdir -p "${PWD}/.apt-cache/archives/partial" "${PWD}/.apt-cache/debs"
          cp "${PWD}"/.apt-cache/debs/*.deb "${PWD}/.apt-cache/archives/" 2>/dev/null || true
          sudo apt-get update
          sudo apt-get \
            -o Dir::Cache::Archives="${PWD}/.apt-cache/archives" \
            install -y \
            cmake \
            catch2 \
            ninja-build \
            pkg-config \
            libssl-dev \
            nlohmann-json3-dev \
            libyaml-cpp-dev \
            libspdlog-dev \
            libsqlite3-dev \
            libsodium-dev \
            libgit2-dev \
            libsecret-1-dev \
            lcov \
            gcovr
          find "${PWD}/.apt-cache/archives" -maxdepth 1 -type f -name '*.deb' -exec cp {} "${PWD}/.apt-cache/debs/" \;

      - name: Save apt package cache
        if: success() && github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: .apt-cache/debs
          key: apt-${{ runner.os }}-${{ hashFiles('.github/workflows/core.yml') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Install
        run: cmake --install build --prefix out/install/linux

      - name: Coverage
        run: ./make.sh coverage

      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        with:
          name: holder-core-coverage
          path: build-coverage/coverage/**
          if-no-files-found: error
          retention-days: 7

  macos:
    runs-on: macos-15

    steps:
      - name: Check out holder-core
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          brew update
          brew install \
            cmake \
            catch2 \
            ninja \
            pkg-config \
            nlohmann-json \
            yaml-cpp \
            spdlog \
            sqlite \
            libsodium \
            libgit2 \
            openssl@3

      - name: Configure
        run: |
          brew_prefix="$(brew --prefix)"
          openssl_prefix="$(brew --prefix openssl@3)"

          cmake \
            -S . \
            -B build \
            -G Ninja \
            -DCMAKE_BUILD_TYPE=RelWithDebInfo \
            -DCMAKE_PREFIX_PATH="${brew_prefix};${openssl_prefix}" \
            -DOPENSSL_ROOT_DIR="${openssl_prefix}"

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests
        run: ctest --test-dir build --output-on-failure

      - name: Install
        run: cmake --install build --prefix out/install/macos

  windows:
    runs-on: windows-latest

    steps:
      - name: Check out holder-core
        uses: actions/checkout@v4

      - name: Set up MSVC developer environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set vcpkg paths
        shell: pwsh
        run: |
          "VCPKG_ROOT=${{ github.workspace }}\.vcpkg" >> $env:GITHUB_ENV
          "VCPKG_DEFAULT_BINARY_CACHE=${{ github.workspace }}\.vcpkg-binary-cache" >> $env:GITHUB_ENV

      - name: Restore vcpkg binary package cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'CMakePresets.json') }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'CMakePresets.json') }}-
            vcpkg-${{ runner.os }}-

      - name: Bootstrap vcpkg
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg "$env:VCPKG_ROOT"
          & "$env:VCPKG_ROOT\bootstrap-vcpkg.bat" -disableMetrics
          New-Item -ItemType Directory -Force "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null

      - name: Configure
        run: cmake --preset windows-vcpkg-debug

      - name: Build
        run: cmake --build out/build/windows-vcpkg-debug --parallel

      - name: Run tests
        run: ctest --test-dir out/build/windows-vcpkg-debug --output-on-failure

      - name: Save vcpkg binary package cache
        if: success() && github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'CMakePresets.json') }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Install
        run: cmake --install out/build/windows-vcpkg-debug --prefix out/install/windows
