name: libholder SDK release

on:
  pull_request:
    paths:
      - .github/workflows/sdk-release.yml
      - scripts/package-sdk.py
      - cmake/libholder-manifest.json.in
      - cmake/holderConfig.cmake.in
      - CMakeLists.txt
      - VERSION
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  sdk:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            build_type: RelWithDebInfo
          - os: ubuntu-24.04
            platform: linux
            build_type: Release
          - os: macos-15
            platform: macos
            build_type: RelWithDebInfo
          - os: macos-15
            platform: macos
            build_type: Release
          - os: windows-latest
            platform: windows
            build_type: RelWithDebInfo
          - os: windows-latest
            platform: windows
            build_type: Release
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          test "${GITHUB_REF_NAME}" = "v$(cat VERSION)"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake catch2 ninja-build pkg-config libssl-dev nlohmann-json3-dev \
            libyaml-cpp-dev libspdlog-dev libsqlite3-dev libsodium-dev \
            libgit2-dev libmd4c-dev libsecret-1-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install cmake catch2 ninja pkg-config nlohmann-json yaml-cpp \
            spdlog sqlite libsodium libgit2 md4c openssl@3

      - name: Configure macOS dependency paths
        if: runner.os == 'macOS'
        run: |
          echo "CMAKE_PREFIX_PATH=$(brew --prefix);$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Bootstrap vcpkg
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg "$env:GITHUB_WORKSPACE/.vcpkg"
          & "$env:GITHUB_WORKSPACE/.vcpkg/bootstrap-vcpkg.bat" -disableMetrics

      - name: Configure Unix SDK
        if: runner.os != 'Windows'
        run: |
          platform_options=()
          if [[ "$RUNNER_OS" == macOS ]]; then
            platform_options=(-DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0)
          fi
          cmake -S . -B out/sdk-build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DHOLDER_CORE_SDK=ON "${platform_options[@]}"

      - name: Configure Windows SDK
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B out/sdk-build -G Ninja `
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DHOLDER_CORE_SDK=ON `
            "-DCMAKE_TOOLCHAIN_FILE=$env:GITHUB_WORKSPACE/.vcpkg/scripts/buildsystems/vcpkg.cmake" `
            "-DVCPKG_INSTALLED_DIR=$env:GITHUB_WORKSPACE/vcpkg_installed" `
            -DVCPKG_TARGET_TRIPLET=x64-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and test
        run: |
          cmake --build out/sdk-build --parallel
          ctest --test-dir out/sdk-build --output-on-failure

      - name: Install SDK
        run: cmake --install out/sdk-build --prefix out/sdk-install

      - name: Archive and smoke-test Unix SDK
        if: runner.os != 'Windows'
        run: >-
          python3 scripts/package-sdk.py
          --install out/sdk-install --output out/sdk-assets
          --commit "$(git rev-parse HEAD)"

      - name: Archive and smoke-test Windows SDK
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/package-sdk.py `
            --install out/sdk-install --output out/sdk-assets `
            --commit (git rev-parse HEAD) `
            --vcpkg-installed "$env:GITHUB_WORKSPACE/vcpkg_installed" `
            --vcpkg-root "$env:GITHUB_WORKSPACE/.vcpkg"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload validated SDK
        uses: actions/upload-artifact@v4
        with:
          name: sdk-${{ matrix.platform }}-${{ matrix.build_type }}
          path: out/sdk-assets/*
          if-no-files-found: error
          retention-days: 7

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: sdk
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: sdk-*
          path: out/sdk-assets
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "${GITHUB_REF_NAME}" = "v$(cat VERSION)"
          assets=(out/sdk-assets/*/*)
          test "${#assets[@]}" -eq 6
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${assets[@]}" --verify-tag --generate-notes
          fi
