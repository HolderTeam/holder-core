name: libholder SDK release

on:
  pull_request:
    paths:
      - .github/workflows/sdk-release.yml
      - .github/workflows/core.yml
      - scripts/package-sdk.py
      - scripts/sdk_dependencies.py
      - scripts/publish-sdk-snapshot.py
      - tests/test_publish_sdk_snapshot.py
      - cmake/libholder-manifest.json.in
      - cmake/holder.pc.in
      - cmake/holderConfig.cmake.in
      - CMakeLists.txt
      - VERSION
  push:
    tags:
      - 'v*'
  workflow_dispatch:
  workflow_run:
    workflows: ['Holder core']
    types: [completed]
    branches: [main]

permissions:
  contents: read

jobs:
  publication-tests:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Test SDK publication and promotion
        run: python3 -m unittest discover -s tests -p test_publish_sdk_snapshot.py -v

  sdk:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            platform: linux
            build_type: RelWithDebInfo
          - os: ubuntu-24.04
            platform: linux
            build_type: Release
          - os: macos-15
            platform: macos
            build_type: RelWithDebInfo
          - os: macos-15
            platform: macos
            build_type: Release
          - os: windows-latest
            platform: windows
            build_type: RelWithDebInfo
          - os: windows-latest
            platform: windows
            build_type: Release
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Check release tag
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          test "${GITHUB_REF_NAME}" = "v$(cat VERSION)"

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake catch2 ninja-build pkg-config libssl-dev nlohmann-json3-dev \
            libyaml-cpp-dev libspdlog-dev libsqlite3-dev libsodium-dev \
            libgit2-dev libmd4c-dev libsecret-1-dev

      - name: Install macOS dependencies
        if: runner.os == 'macOS'
        run: |
          brew update
          brew install cmake catch2 ninja pkg-config nlohmann-json yaml-cpp \
            spdlog sqlite libsodium libgit2 md4c openssl@3

      - name: Configure macOS dependency paths
        if: runner.os == 'macOS'
        run: |
          echo "CMAKE_PREFIX_PATH=$(brew --prefix);$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"

      - name: Set up MSVC
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1

      - name: Set vcpkg paths
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          "VCPKG_ROOT=${{ github.workspace }}\.vcpkg" >> $env:GITHUB_ENV
          "VCPKG_DEFAULT_BINARY_CACHE=${{ github.workspace }}\.vcpkg-binary-cache" >> $env:GITHUB_ENV

      - name: Restore vcpkg binary package cache
        if: runner.os == 'Windows'
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'CMakePresets.json') }}-sdk-${{ matrix.build_type }}-${{ github.run_id }}-${{ github.run_attempt }}
          restore-keys: |
            vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'CMakePresets.json') }}-
            vcpkg-${{ runner.os }}-

      - name: Bootstrap vcpkg
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          git clone https://github.com/microsoft/vcpkg "$env:VCPKG_ROOT"
          & "$env:VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics
          New-Item -ItemType Directory -Force "$env:VCPKG_DEFAULT_BINARY_CACHE" | Out-Null

      - name: Configure Unix SDK
        if: runner.os != 'Windows'
        run: |
          platform_options=()
          if [[ "$RUNNER_OS" == macOS ]]; then
            platform_options=(-DCMAKE_OSX_ARCHITECTURES=arm64 -DCMAKE_OSX_DEPLOYMENT_TARGET=15.0)
          fi
          cmake -S . -B out/sdk-build -G Ninja \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DHOLDER_CORE_SDK=ON -DHOLDER_CORE_BUILD_SHARED=OFF "${platform_options[@]}"

      - name: Configure Windows SDK
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake -S . -B out/sdk-build -G Ninja `
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} -DHOLDER_CORE_SDK=ON -DHOLDER_CORE_BUILD_SHARED=OFF `
            "-DCMAKE_TOOLCHAIN_FILE=$env:GITHUB_WORKSPACE/.vcpkg/scripts/buildsystems/vcpkg.cmake" `
            "-DVCPKG_INSTALLED_DIR=$env:GITHUB_WORKSPACE/vcpkg_installed" `
            -DVCPKG_TARGET_TRIPLET=x64-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Build and test
        run: |
          cmake --build out/sdk-build --parallel
          ctest --test-dir out/sdk-build --output-on-failure

      - name: Install SDK
        run: cmake --install out/sdk-build --prefix out/sdk-install

      - name: Archive and smoke-test Unix SDK
        if: runner.os != 'Windows'
        run: >-
          python3 scripts/package-sdk.py
          --install out/sdk-install --output out/sdk-assets
          --commit "$(git rev-parse HEAD)"

      - name: Archive and smoke-test Windows SDK
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          python scripts/package-sdk.py `
            --install out/sdk-install --output out/sdk-assets `
            --commit (git rev-parse HEAD) `
            --vcpkg-installed "$env:GITHUB_WORKSPACE/vcpkg_installed" `
            --vcpkg-root "$env:GITHUB_WORKSPACE/.vcpkg"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Save vcpkg binary package cache
        if: runner.os == 'Windows' && success() && github.event_name != 'pull_request'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.VCPKG_DEFAULT_BINARY_CACHE }}
          key: vcpkg-${{ runner.os }}-${{ hashFiles('vcpkg.json', 'CMakePresets.json') }}-sdk-${{ matrix.build_type }}-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Upload validated SDK
        uses: actions/upload-artifact@v4
        with:
          name: sdk-${{ matrix.platform }}-${{ matrix.build_type }}
          path: out/sdk-assets/*
          if-no-files-found: error
          retention-days: 7

  validate-snapshot:
    needs: [sdk, publication-tests]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: sdk-*
          path: out/snapshot-assets
          merge-multiple: true
      - name: Validate the complete snapshot and generate its index
        run: >-
          python3 scripts/publish-sdk-snapshot.py
          --assets out/snapshot-assets --index out/snapshot-index/sdk-index.json
          --repository "$GITHUB_REPOSITORY" --commit "$(git rev-parse HEAD)"
          --sdk-run-id "$GITHUB_RUN_ID" --validate-only
      - uses: actions/upload-artifact@v4
        with:
          name: snapshot-index
          path: out/snapshot-index/sdk-index.json
          if-no-files-found: error
          retention-days: 7

  snapshot:
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    needs: validate-snapshot
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
      actions: read
    concurrency:
      group: libholder-latest-green-publication
      queue: max
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: sdk-*
          path: out/snapshot-assets
          merge-multiple: true
      - name: Publish the immutable snapshot and promote latest-green
        env:
          GH_TOKEN: ${{ github.token }}
          CORE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: >-
          python3 scripts/publish-sdk-snapshot.py
          --assets out/snapshot-assets --index out/snapshot-index/sdk-index.json
          --repository "$GITHUB_REPOSITORY" --commit "$(git rev-parse HEAD)"
          --core-run-id "$CORE_RUN_ID" --sdk-run-id "$GITHUB_RUN_ID"

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: [sdk, validate-snapshot]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          pattern: sdk-*
          path: out/sdk-assets
      - name: Publish release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          test "${GITHUB_REF_NAME}" = "v$(cat VERSION)"
          assets=(out/sdk-assets/*/*)
          test "${#assets[@]}" -eq 6
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" "${assets[@]}" --clobber
          else
            gh release create "${GITHUB_REF_NAME}" "${assets[@]}" --verify-tag --generate-notes
          fi
